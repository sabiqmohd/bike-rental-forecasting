name: CI-CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: latest

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "app-ml/requirements.txt" ]; then pip install -r app-ml/requirements.txt; fi
          pip install pytest requests

      - name: Run pytest (end-to-end tests)
        run: |
          # run tests in tests/ — these will execute:
          # - tests/test_prod_train.py  (runs prod_train.py and checks models/prod)
          pytest -q tests/

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify Public ECR Access
        run: |
          echo "Testing Public ECR Access..."
          aws ecr-public describe-repositories --region us-east-1
          echo "Registry Alias:"
          aws ecr-public describe-registries --region us-east-1 --query 'registries[0].registryId'

      - name: Login to Amazon ECR (Manual)
        id: login-ecr
        run: |
          # Manual login using AWS CLI to bypass potential action issues
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
          
          # Set the registry URL output for subsequent steps
          echo "registry=public.ecr.aws/$(aws ecr-public describe-registries --region us-east-1 --query 'registries[0].registryId' --output text)" >> $GITHUB_OUTPUT

      - name: Build and Push ML Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_ML }}
          IMAGE_TAG: latest
        run: |
          # Build ML image using the app-ml Dockerfile.
          # Note: Context is root (.) to include shared 'common' code if needed
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f app-ml/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build and Push UI Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_UI }}
          IMAGE_TAG: latest
        run: |
          # Build UI image using the app-ui Dockerfile.
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f app-ui/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Verify Public ECR Access
        run: |
          echo "Testing Public ECR Access...."
          # This command lists your public repositories. 
          # If this fails, your IAM User is missing 'AmazonElasticContainerRegistryPublicFullAccess'
          aws ecr-public describe-repositories --region us-east-1
          
          echo "Registry Alias:"
          aws ecr-public describe-registries --region us-east-1 --query 'registries[0].registryId'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull and Deploy with Docker Compose
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_ML: ${{ secrets.ECR_REPOSITORY_ML }}
          ECR_REPOSITORY_UI: ${{ secrets.ECR_REPOSITORY_UI }}
          IMAGE_TAG: latest
        run: |
          # Pull the latest images
          # Environment variables are substituted into docker-compose.yml automatically
          docker-compose pull
          
          # Restart services with new images
          docker-compose up -d

      - name: Cleanup
        run: |
          docker system prune -f